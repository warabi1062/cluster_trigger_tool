name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# JavaScript アクションを Node.js 24 ランタイムで実行する（Node.js 20 は廃止予定のため）
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# GITHUB_TOKEN に Pages へのデプロイ権限を付与する
permissions:
  contents: read
  pages: write
  id-token: write

# 同時に1つのデプロイのみ実行する（進行中のものは中断しない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (static export)
        env:
          GITHUB_PAGES: "true"
        run: pnpm build

      - name: Add .nojekyll
        # Next.js の _next ディレクトリを GitHub Pages の Jekyll が無視しないようにする
        run: touch out/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
